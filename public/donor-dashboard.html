<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor Dashboard - LifeSave</title><link rel="stylesheet" href="styles/style.css"></head><body><header class="main-header compact"><div class="brand-container"><h1 class="brand-name">🩸 LifeSave</h1></div><nav class="centered-nav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="donor-dashboard.html">Donor</a><button class="nav-button" id="logoutBtn">Logout</button></nav></header><main class="dashboard-shell"><div id="donorMessage" class="message hidden"></div><section id="donorPanel" class="panel"><h2>Donor Dashboard</h2><div id="donorSummary"></div><div class="inline-actions"><label class="toggle"><input type="checkbox" id="availabilityToggle"><span>Available for donation</span></label><form id="lastDonationForm" class="inline-form"><input type="date" id="lastDonationDate"><button class="secondary-action">Update Last Donation</button></form></div></section><section id="becomePanel" class="panel hidden"><h2>Become a Donor</h2><form id="becomeForm" class="form-grid"><div class="input-group"><label>Blood Group</label><select id="bdBlood" required><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div class="input-group"><label>Age</label><input id="bdAge" type="number" min="18" max="65" required></div><div class="input-group"><label>Weight</label><input id="bdWeight" type="number" min="50" required></div><div class="input-group"><label>Location</label><input id="bdLocation" required></div><button class="submit-btn full">Create Donor Profile</button></form></section><section class="panel"><h2>Donation History</h2><div id="donationHistory" class="table-wrap"></div></section></main><script src="scripts/api.js"></script><script src="scripts/auth.js"></script><script src="scripts/donor-dashboard.js"></script></body></html>
