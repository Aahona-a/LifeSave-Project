<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - LifeSave</title><link rel="stylesheet" href="styles/style.css"></head><body><header class="main-header compact"><div class="brand-container"><h1 class="brand-name">🩸 LifeSave</h1></div><nav class="centered-nav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="profile.html">Profile</a><button class="nav-button" id="logoutBtn">Logout</button></nav></header><main class="dashboard-shell"><section class="panel"><h2>Profile Management</h2><div id="message" class="message hidden"></div><div class="profile-layout"><div><img id="profilePreview" class="profile-large" src="assets/default-avatar.svg"><form id="imageForm"><input type="file" id="profileImage" accept="image/png,image/jpeg,image/webp" required><button class="secondary-action" type="submit">Upload Image</button></form></div><form id="profileForm" class="form-grid"><div class="input-group"><label>Name</label><input id="profileName"></div><div class="input-group"><label>Phone</label><input id="profilePhone"></div><div class="input-group"><label>Gender</label><select id="profileGender"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div><div class="input-group"><label>City</label><input id="profileCity"></div><div class="input-group"><label>District</label><input id="profileDistrict"></div><div class="input-group"><label>Email</label><input id="profileEmail" disabled></div><button class="submit-btn full" type="submit">Save Profile</button></form></div></section><section class="panel"><h2>Change Password</h2><form id="passwordForm" class="form-grid"><div class="input-group"><label>Current Password</label><input type="password" id="currentPassword" required></div><div class="input-group"><label>New Password</label><input type="password" id="newPassword" minlength="6" required></div><button class="submit-btn full">Change Password</button></form></section></main><script src="scripts/api.js"></script><script src="scripts/auth.js"></script><script src="scripts/profile.js"></script></body></html>
