<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Requests - LifeSave</title><link rel="stylesheet" href="styles/style.css"></head><body><header class="main-header compact"><div class="brand-container"><h1 class="brand-name">🩸 LifeSave</h1></div><nav class="centered-nav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="requests.html">Requests</a><button class="nav-button" id="logoutBtn">Logout</button></nav></header><main class="dashboard-shell"><section class="panel"><div class="section-heading"><div><span class="eyebrow red">EMERGENCY REQUEST</span><h2>Post Blood Request</h2></div></div><div id="message" class="message hidden"></div><form id="requestForm" class="form-grid"><div class="input-group"><label>Patient Name</label><input id="patientName" required></div><div class="input-group"><label>Blood Group</label><select id="requestBloodGroup" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div class="input-group"><label>Units</label><input type="number" id="units" min="1" max="20" value="1" required></div><div class="input-group"><label>Urgency</label><select id="urgency"><option value="normal">Normal</option><option value="urgent" selected>Urgent</option><option value="critical">Critical</option></select></div><div class="input-group"><label>Hospital</label><input id="hospital" required></div><div class="input-group"><label>Location</label><input id="requestLocation" required></div><div class="input-group"><label>Needed At</label><input type="datetime-local" id="neededAt" required></div><div class="input-group"><label>Contact Phone</label><input id="contactPhone" required placeholder="017XXXXXXXX"></div><div class="input-group full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div><button class="submit-btn full">Post Request</button></form></section><section class="panel"><h2>Open Requests</h2><div id="openRequests" class="request-grid"></div></section><section class="panel"><h2>My Requests</h2><div id="myRequests" class="request-grid"></div></section></main><script src="scripts/api.js"></script><script src="scripts/auth.js"></script><script src="scripts/requests.js"></script></body></html>
