<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - LifeSave</title><link rel="stylesheet" href="styles/style.css"></head><body><header class="main-header compact"><div class="brand-container"><h1 class="brand-name">🩸 LifeSave</h1><p class="brand-subtitle">A Smart Blood Donation & Emergency Support System</p></div><nav class="centered-nav"><a href="index.html">Home</a><a href="login.html">Login</a><a class="active" href="register.html">Become a Donor</a></nav></header><section class="form-container"><div class="form-box wide"><span class="eyebrow red">JOIN LIFESAVE</span><h2>Create New Account</h2><div id="message" class="message hidden"></div><form id="registerForm"><div class="form-grid"><div class="input-group"><label>Full Name</label><input id="name" required></div><div class="input-group"><label>Email Address</label><input type="email" id="email" required></div><div class="input-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="017XXXXXXXX" required></div><div class="input-group"><label>Gender</label><select id="gender" required><option value="">Select Gender</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div><div class="input-group full"><label>Password</label><input type="password" id="password" minlength="6" required></div></div><div class="checkbox-group"><input type="checkbox" id="isDonor"><label for="isDonor"><strong>I want to register as a Blood Donor</strong></label></div><div id="donorFields" class="donor-fields hidden"><div class="form-grid"><div class="input-group"><label>Age (18-65)</label><input type="number" id="age" min="18" max="65"></div><div class="input-group"><label>Weight in kg (Min 50)</label><input type="number" id="weight" min="40" step="0.1"></div><div class="input-group"><label>Blood Group</label><select id="bloodGroupReg"><option value="">Select Group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div class="input-group"><label>Current Area / City</label><input id="regLocation" placeholder="e.g. Dhanmondi, Dhaka"></div><div class="input-group"><label>Last Donation Date</label><input type="date" id="lastDonation"></div></div></div><button type="submit" class="submit-btn">Register Account</button></form></div></section><script src="scripts/api.js"></script><script src="scripts/register.js"></script></body></html>
